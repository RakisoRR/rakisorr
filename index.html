<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bookmarks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Serif+Display&display=swap" rel="stylesheet" />
</head>
<body>
  <main class="page">
    <header class="hero">
      <div class="hero-top">
        <h1>Bookmarks</h1>
        <div class="hero-aside">
          <div class="clock" aria-live="polite">
            <time id="clockTime"></time>
            <span id="clockDate"></span>
          </div>
          <nav class="nav" id="toolbar" aria-label="Account">
            <button type="button" class="btn primary" id="signInBtn">Sign in</button>
            <div class="account" id="account" hidden>
              <span id="userEmail"></span>
            </div>
            <button type="button" class="btn" id="editToggle" hidden aria-pressed="false">Edit</button>
            <button type="button" class="btn" id="signOutBtn" hidden>Sign out</button>
            <div class="menu" id="settingsMenu" hidden>
              <button type="button" class="btn icon-btn" id="settingsBtn" aria-label="Settings" aria-haspopup="menu" aria-expanded="false" aria-controls="settingsPanel">⚙</button>
              <div class="menu-panel" id="settingsPanel" role="menu" hidden>
                <button type="button" class="menu-item" id="exportBtn" role="menuitem">Export</button>
                <button type="button" class="menu-item" id="importBtn" role="menuitem">Import</button>
                <button type="button" class="menu-item danger" id="resetBtn" role="menuitem">Reset</button>
              </div>
            </div>
            <input type="file" id="importFile" accept="application/json,.json" hidden />
          </nav>
        </div>
      </div>

      <div class="search-stack">
        <form class="search-row" action="https://www.google.com/search" method="get" role="search" aria-label="Google search">
          <label class="sr-only" for="google-q">Search Google</label>
          <input id="google-q" name="q" type="search" placeholder="Search the web…" autocomplete="off" autofocus />
          <button type="submit">Go</button>
        </form>

        <form class="search-row" role="search" aria-label="Filter bookmarks" onsubmit="return false">
          <label class="sr-only" for="filter-q">Filter bookmarks</label>
          <input id="filter-q" type="search" placeholder="Filter bookmarks…" autocomplete="off" spellcheck="false" />
        </form>

        <p class="filter-hint">Press <kbd>/</kbd> to filter bookmarks. Sign in to edit and sync across devices.</p>
      </div>
    </header>

    <div id="sections" class="sections"></div>
    <div class="add-section-wrap">
      <button type="button" class="btn primary" id="addSectionBtn">Add section</button>
    </div>
    <p id="emptyState" class="empty-state" hidden>No bookmarks match your filter.</p>
  </main>

  <dialog class="modal" id="authModal">
    <header>
      <h3 id="authModalTitle">Sign in</h3>
      <button type="button" class="btn" id="closeAuthModal">Close</button>
    </header>
    <form id="authForm">
      <div class="auth-tabs" role="tablist">
        <button type="button" class="btn toggled" id="authTabSignIn" role="tab" aria-selected="true">Sign in</button>
        <button type="button" class="btn" id="authTabSignUp" role="tab" aria-selected="false">Create account</button>
      </div>
      <div class="row">
        <label for="authEmail">Email</label>
        <input id="authEmail" name="email" type="email" required autocomplete="email" placeholder="you@example.com" />
      </div>
      <div class="row">
        <label for="authPassword">Password</label>
        <input id="authPassword" name="password" type="password" required autocomplete="current-password" minlength="6" placeholder="At least 6 characters" />
      </div>
      <p class="auth-message" id="authMessage" hidden></p>
      <div class="form-actions">
        <button type="button" class="btn" id="cancelAuthBtn">Cancel</button>
        <button type="submit" class="btn primary" id="authSubmitBtn">Sign in</button>
      </div>
    </form>
  </dialog>

  <dialog class="modal" id="bookmarkModal">
    <header>
      <h3 id="modalTitle">Add bookmark</h3>
      <button type="button" class="btn" id="closeModal">Close</button>
    </header>
    <form id="bookmarkForm">
      <input type="hidden" id="editId" />
      <input type="hidden" id="editSectionIndex" />
      <div class="row">
        <label for="title">Title</label>
        <input id="title" name="title" required placeholder="e.g. ChatGPT" />
      </div>
      <div class="row">
        <label for="url">Link</label>
        <input id="url" name="url" type="url" required placeholder="https://…" />
      </div>
      <div class="row">
        <label for="initials">Initials</label>
        <input id="initials" name="initials" maxlength="3" placeholder="Auto" />
      </div>
      <div class="row">
        <label for="section">Section</label>
        <select id="section" name="section"></select>
      </div>
      <div class="form-actions">
        <button type="button" class="btn danger" id="deleteBtn" hidden>Delete</button>
        <button type="button" class="btn" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn primary" id="saveBtn">Save</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
